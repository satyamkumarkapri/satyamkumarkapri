name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Date-Wise Contribution Graph & Assets
        run: |
          python scripts/generate-assets.py

      - name: Commit & Push Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Update date-wise contribution graph [skip ci]"
          file_pattern: "assets/*.svg"
