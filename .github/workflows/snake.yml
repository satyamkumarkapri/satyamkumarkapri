name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: satyamkumarkapri
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F2C879&color_dots=#171717,#3A3020,#785E2B,#C5A059,#F2C879

      - name: Commit & Push Snake Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Update contribution grid snake [skip ci]"
          file_pattern: "assets/github-contribution-grid-snake*.svg"

